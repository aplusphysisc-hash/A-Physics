    <meta name="description" content="Chế độ dùng thử trực tuyến (Web Demo) của ứng dụng Android A+ Physics - Dự án NCKH Trường THPT Chu Văn An.">
    <meta name="theme-color" content="#070D1F">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="../assets/ic_logo_aphysics.png">

    <!-- Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- KaTeX -->

    <!-- Google Model Viewer -->

<body class="min-h-screen flex flex-col pb-20 md:pb-6 selection:bg-[#4FD1C5] selection:text-slate-950">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">

                    <img src="../assets/ic_logo_aphysics.png" alt="A+ Physics" class="w-10 h-10 rounded-xl object-cover bg-white shadow-md">
                </a>
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="font-extrabold text-base sm:text-lg text-white">A+ Physics</span>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-400/40">DÙNG THỬ</span>
                    </div>
                    <span id="header-subtitle" class="text-[11px] text-slate-400 block -mt-0.5">Bản trải nghiệm Web Demo • <a href="../index.html#tai-ve" class="text-[#4FD1C5] hover:underline">Tải App Android</a></span>
                </div>
            </div>

                    <span>Trang chủ</span>

                    <img src="../assets/icons/ic_topic_atom.png" alt="" class="w-4 h-4 object-contain">
                    <span>3D &amp; Công cụ</span>
                </button>
                <button data-nav="saved" class="nav-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-1.5">

                    <span>Cài đặt</span>
                </button>
            </nav>

            <!-- Right status chips -->
            <div class="flex items-center space-x-2">
                <button id="btn-toggle-music-bar" title="Nhạc tập trung sóng não" class="px-2.5 py-1.5 rounded-lg bg-[#162347] border border-[#2A3C6E] hover:border-[#4FD1C5] text-xs font-semibold text-slate-200 flex items-center space-x-1.5 transition">
                    <span id="music-status-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                    <span class="hidden sm:inline">Nhạc tập trung</span>
                    <img src="../assets/icons/ic_music_headphones.png" alt="Nhạc" class="w-4 h-4 object-contain">
                </button>
                <div id="header-streak-chip" class="px-2.5 py-1.5 rounded-lg bg-[#162347] border border-amber-500/30 text-xs font-bold text-amber-300 flex items-center space-x-1">
                    <img src="../assets/icons/ic_streak_fire.png" alt="Streak" class="w-4 h-4 object-contain">
                    <span id="header-streak-count">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- FLOATING FOCUS MUSIC BAR (hidden by default) -->
    <div id="focus-music-bar" class="hidden sticky top-16 z-30 bg-[#0F1A36]/95 border-b border-[#4FD1C5]/30 px-4 py-2.5">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3 text-xs">
            <div class="flex items-center space-x-3">
                <span class="font-bold text-[#4FD1C5]">🎧 Âm thanh tập trung:</span>
                <select id="music-track-select" class="bg-[#070D1F] border border-[#2A3C6E] rounded-lg px-2.5 py-1 text-slate-200 focus:outline-none focus:border-[#4FD1C5]">
                    <option value="../assets/audio/song_nao_alpha.aac">🧠 Sóng não Alpha (Tập trung)</option>
                    <option value="../assets/audio/tieng_mua.aac">🌧️ Tiếng mưa rơi</option>
                    <option value="../assets/audio/song_bien.aac">🌊 Sóng biển vỗ</option>
                </select>
                <button id="music-play-btn" class="px-3 py-1 rounded-lg bg-[#4FD1C5] text-slate-950 font-bold hover:opacity-90">▶ Phát</button>
            </div>
            <div class="flex items-center space-x-3">
                <label class="flex items-center space-x-1.5 text-slate-300">
                    <span>Âm lượng</span>
                    <input id="music-volume" type="range" min="0" max="1" step="0.05" value="0.5" class="w-20 accent-[#4FD1C5]">
                </label>
                <button id="music-close-btn" class="text-slate-400 hover:text-white px-2">✕</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <main id="app-main" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6">
        <div class="flex flex-col items-center justify-center py-20 text-center">
            <img src="../assets/ic_logo_loading.webp" alt="A+ Physics" class="w-16 h-16 rounded-2xl mb-4 animate-pulse">
            <p class="text-sm text-slate-300 font-semibold">Đang tải dữ liệu học tập A+ Physics...</p>
        </div>
    </main>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-[#070D1F]/95 backdrop-blur-md border-t border-[#2A3C6E] px-2 py-1.5 grid grid-cols-5 gap-1">
        <button data-nav="home" class="nav-btn flex flex-col items-center py-1 rounded-lg text-[10px] font-semibold space-y-0.5">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Trang chủ</span>
        </button>
        <button data-nav="roadmap" class="nav-btn flex flex-col items-center py-1 rounded-lg text-[10px] font-semibold space-y-0.5">

            <span>3D &amp; Tool</span>
        </button>
        <button data-nav="saved" class="nav-btn flex flex-col items-center py-1 rounded-lg text-[10px] font-semibold space-y-0.5">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>

        <div class="relative max-w-4xl w-full flex flex-col items-center">

            <p id="lightbox-caption" class="text-xs text-slate-300 mt-2 text-center"></p>
        </div>
    </div>

    <!-- YOUTUBE VIDEO MODAL -->
    <div id="modal-youtube" class="hidden fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
        <div class="max-w-4xl w-full bg-[#0F1A36] border border-[#2A3C6E] rounded-2xl overflow-hidden shadow-2xl">
            <div class="flex items-center justify-between px-4 py-3 border-b border-[#2A3C6E]">
                <span id="yt-modal-title" class="text-sm font-bold text-white">Video Bài Giảng</span>
                <div class="flex items-center space-x-3">
                    <a id="yt-external-link" href="#" target="_blank" rel="noopener noreferrer" class="text-xs text-[#4FD1C5] hover:underline">Mở YouTube ↗</a>
                    <button id="yt-modal-close" class="px-2.5 py-1 rounded-lg bg-slate-800 text-white text-xs font-bold hover:bg-slate-700">✕ Đóng</button>
                </div>
            </div>
            <div class="aspect-video bg-black">
                <iframe id="yt-iframe" class="w-full h-full" src="" title="Video bài giảng" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- FULLSCREEN 3D MODAL -->
    <div id="modal-3d" class="hidden fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">

            <div class="flex items-center justify-between px-4 py-3 border-b border-[#2A3C6E]">

        </div>
    </div>
